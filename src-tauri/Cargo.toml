[package]
name = "tally"
version = "0.1.0"
description = "Tally: a calm, local-first planner for study and work"
authors = ["Tally"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "tally_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "~2.13"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
imap = "2.4"
native-tls = "0.2"
mail-parser = "0.11"
ureq = "2"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
url = "2"
llama-cpp-2 = { version = "0.1.160", default-features = false }

# Each OS keeps the email app password in its own secure store.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
